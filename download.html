<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الملف - FileShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121418; color: #e1e7ec; font-family: system-ui, -apple-system, sans-serif; }
        .gofile-card { background-color: #1a1d24; border: 1px solid #2a2f3a; }
        .gofile-green { background-color: #00d26a; color: #000; }
        .gofile-green:hover { background-color: #00be5e; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="border-b border-gray-800 py-4 px-6 flex justify-between items-center bg-[#16181d]">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up text-[#00d26a] text-2xl"></i>
            <span class="font-bold text-xl tracking-wider text-white">FileShare</span>
        </div>
        <div class="text-sm text-gray-400">تحميل الملفات الآمن</div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="gofile-card w-full max-w-xl rounded-2xl p-8 shadow-2xl text-center">
            
            <div id="loading-section" class="py-8">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-[#00d26a] mb-4"></i>
                <p class="text-gray-300 text-sm font-medium">جاري جلب بيانات الملف...</p>
            </div>

            <div id="file-section" class="hidden">
                <i class="fa-solid fa-file-arrow-down text-5xl text-[#00d26a] mb-4"></i>
                <h1 id="file-name" class="text-xl font-bold mb-2 text-white truncate">اسم الملف</h1>
                <p id="file-date" class="text-gray-400 text-xs mb-8">تاريخ الرفع: --</p>

                <a id="download-btn" href="#" download class="gofile-green font-bold px-8 py-3 rounded-xl text-base transition-all inline-block w-full shadow-lg">
                    <i class="fa-solid fa-download ml-2"></i> تحميل الملف الآن
                </a>
            </div>

            <div id="error-section" class="hidden py-8">
                <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>
                <h3 class="text-white font-bold text-lg mb-2">الملف غير موجود أو تم حذفه!</h3>
                <p class="text-gray-400 text-xs">تأكد من صحة الرابط أو اطلب رابطاً جديداً.</p>
                <a href="index.html" class="mt-6 inline-block text-sm text-[#00d26a] underline">الذهاب لصفحة الرفع</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-500 border-t border-gray-800 bg-[#16181d]">
        جميع الحقوق محفوظة &copy; 2026
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUI5HLO1TgaXXoxHQ81JrwCw5OqADZGmY",
            authDomain: "kabaka-1fb1b.firebaseapp.com",
            databaseURL: "https://kabaka-1fb1b-default-rtdb.firebaseio.com",
            projectId: "kabaka-1fb1b",
            storageBucket: "kabaka-1fb1b.firebasestorage.app",
            messagingSenderId: "714186716062",
            appId: "1:714186716062:web:39e5f6603a69d5bc2b9c8f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        const loadingSection = document.getElementById('loading-section');
        const fileSection = document.getElementById('file-section');
        const errorSection = document.getElementById('error-section');
        const fileNameEl = document.getElementById('file-name');
        const fileDateEl = document.getElementById('file-date');
        const downloadBtn = document.getElementById('download-btn');

        async function fetchFile() {
            if (!fileId) {
                loadingSection.classList.add('hidden');
                errorSection.classList.remove('hidden');
                return;
            }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `files/${fileId}`));

                if (snapshot.exists()) {
                    const fileData = snapshot.val();
                    loadingSection.classList.add('hidden');
                    fileSection.classList.remove('hidden');

                    fileNameEl.textContent = fileData.name;
                    fileDateEl.textContent = "تاريخ الرفع: " + new Date(fileData.createdAt).toLocaleDateString('ar-EG');
                    
                    // ربط البيانات ليقوم المستخدم بالتحميل المباشر
                    downloadBtn.href = fileData.data;
                    downloadBtn.download = fileData.name;
                } else {
                    loadingSection.classList.add('hidden');
                    errorSection.classList.remove('hidden');
                }
            } catch (err) {
                loadingSection.classList.add('hidden');
                errorSection.classList.remove('hidden');
            }
        }

        fetchFile();
    </script>
</body>
</html>
